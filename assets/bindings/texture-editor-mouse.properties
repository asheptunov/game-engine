# Texture editor mouse bindings.
# Format: <chord> = <action-id>
# Chord tokens (+ separated, any order, case-insensitive):
#   gesture  (required): press, release, drag, wheel
#   button   (optional): left, middle, right, none  (default none; drag/wheel carry no button)
#   modifier (optional): ctrl, shift, alt, meta
#   mode     (optional): matched against the scene's current mode
# See the mouse ActionRegistry in TextureEditor.java for the canonical list of action ids.
left+press+pixel_select = select.pixel
left+press+box_select = box.start
left+press+lasso_select = lasso.start
left+press+brush = brush.paint
left+press+fill = fill.apply
left+press+color_picker = colorpicker.mouse
left+release+box_select = box.finish
left+release+lasso_select = lasso.finish
left+release+brush = history.save
left+release+color_picker = colorpicker.mouse
drag+box_select = box.update
drag+lasso_select = lasso.update
drag+brush = brush.paint
drag+color_picker = colorpicker.mouse
wheel+command_entry = console.scroll
