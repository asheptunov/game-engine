# Texture editor key bindings.
# Format: <chord> = <action-id>
# Chord modifiers: ctrl, shift, alt, meta (case-insensitive, any order, + separated).
# See ActionRegistry in TextureEditor.java for the canonical list of action ids.

q = mode.pixel_select
w = mode.box_select
e = mode.lasso_select
r = mode.brush
t = mode.fill
c = mode.color_picker
/ = mode.command_entry

escape = selection.clear
ctrl+a = selection.all

f1 = help.toggle
f2 = toolcard.toggle
f5 = file.save
f9 = file.load

ctrl+z = history.undo
ctrl+shift+z = history.redo
