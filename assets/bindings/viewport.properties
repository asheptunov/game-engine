# Viewport (3D ray-tracing scene) key bindings.
# Format: <chord> = <action-id>
# Chord modifiers: ctrl, shift, alt, meta (case-insensitive, any order, + separated).
# See ActionRegistry in Viewport.java for the canonical list of action ids.

/ = console.open

w = camera.move.forward
s = camera.move.back
a = camera.strafe.left
d = camera.strafe.right
space = camera.move.up
l_ctrl = camera.move.down
r_ctrl = camera.move.down
r = camera.reset
